[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "bvlain"
authors = [{name = "Artem Dembitskiy", email = "art.dembitskiy@gmail.com"}]
dynamic = ["version", "description"]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "pandas",
  "scipy>=1.7.0",
  "pymatgen>=2022.5.26",
  "ase",
  "numba"
]


[project.optional-dependencies]
doc = [
    'sphinx~=5.3.0',
    'myst-parser',
    'furo',
    'nbsphinx',
    'ase'
]

[tool.poetry]
# ...
packages = [
    { include = "bvlain" },
]

[project.scripts]
lain = "bvlain.cli:main"
